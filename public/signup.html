<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — GuestReply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/">Guest<span>Reply</span></a>
    <nav class="nav"><a href="/login">Log in</a></nav>
  </header>

  <main class="auth">
    <h1>Create your account</h1>
    <p class="muted">Start with 5 free review replies. No card needed.</p>
    <form id="form">
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="name" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <p class="hint">At least 8 characters.</p>
      <div class="form-actions">
        <button class="btn" type="submit">Create account</button>
        <span class="muted">Have an account? <a href="/login">Log in</a></span>
      </div>
      <div class="msg error" id="msg"></div>
    </form>
  </main>
</div>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  const msg = document.getElementById("msg");
  btn.disabled = true; msg.classList.remove("show");
  try {
    const r = await fetch("/api/signup", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.fromEntries(new FormData(e.target))),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    location.href = "/app";
  } catch (err) {
    msg.textContent = err.message || "Something went wrong."; msg.classList.add("show");
    btn.disabled = false;
  }
});
</script>
</body>
</html>
